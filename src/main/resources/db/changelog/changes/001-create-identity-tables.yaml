# Identity and access model: users, the roles they hold, the permissions those
# roles grant, and the refresh tokens issued at login.
#
# Permissions are the unit the API actually checks (@PreAuthorize reads a
# permission code, never a role name), and roles exist only to bundle them.
# That keeps a new capability a matter of granting a permission to a role
# rather than of editing every annotation that guards it.
databaseChangeLog:
  - changeSet:
      id: 001-create-identity-tables
      author: vitalcare
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: username
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
              # Never the password itself. BCrypt output is 60 characters, but
              # the column is wider so the encoder can be swapped without a
              # migration.
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
              - column:
                  name: last_login_at
                  type: timestamp with time zone
        - addUniqueConstraint:
            tableName: users
            columnNames: username
            constraintName: uq_users_username
        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: uq_users_email

        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_roles
              # The stable identifier the seed data and the code refer to;
              # "name" is only ever shown to a human and is free to change.
              - column:
                  name: code
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
              # A system role is one the application itself relies on. The API
              # refuses to delete or re-code it, so an admin cannot lock every
              # account out of the system by tidying up the role list.
              - column:
                  name: system_role
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: roles
            columnNames: code
            constraintName: uq_roles_code

        - createTable:
            tableName: permissions
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_permissions
              # "resource:action", e.g. users:write. This exact string is what
              # @PreAuthorize matches, so it is part of the API contract.
              - column:
                  name: code
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
        - addUniqueConstraint:
            tableName: permissions
            columnNames: code
            constraintName: uq_permissions_code

        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: bigint
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: pk_user_roles
        # Deleting a user takes its role assignments with it; deleting a role
        # that is still assigned is refused, which the API surfaces as a 409.
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            constraintName: fk_user_roles_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            constraintName: fk_user_roles_role
            referencedTableName: roles
            referencedColumnNames: id
            onDelete: RESTRICT

        - createTable:
            tableName: role_permissions
            columns:
              - column:
                  name: role_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: bigint
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: role_permissions
            columnNames: role_id, permission_id
            constraintName: pk_role_permissions
        - addForeignKeyConstraint:
            baseTableName: role_permissions
            baseColumnNames: role_id
            constraintName: fk_role_permissions_role
            referencedTableName: roles
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: role_permissions
            baseColumnNames: permission_id
            constraintName: fk_role_permissions_permission
            referencedTableName: permissions
            referencedColumnNames: id
            onDelete: CASCADE

        # Refresh tokens are stored so that logout, rotation and "revoke every
        # session" are real operations rather than a hope that the client threw
        # the token away. Only the SHA-256 of the token is kept, so a dump of
        # this table is not enough to mint an access token.
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_refresh_tokens
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: timestamp with time zone
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: refresh_tokens
            columnNames: token_hash
            constraintName: uq_refresh_tokens_token_hash
        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: user_id
            constraintName: fk_refresh_tokens_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_user_id
            columns:
              - column:
                  name: user_id

        # The list view sorts by created_at by default and filters on status,
        # so those are the two worth indexing up front.
        - createIndex:
            tableName: users
            indexName: idx_users_created_at
            columns:
              - column:
                  name: created_at
        - createIndex:
            tableName: users
            indexName: idx_users_status
            columns:
              - column:
                  name: status
