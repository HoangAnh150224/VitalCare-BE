databaseChangeLog:
  - changeSet:
      id: 008-create-domain-tables
      author: vitalcare
      changes:
        - createTable:
            tableName: clinic
            columns:
              - column:
                  name: clinic_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_clinic
              - column:
                  name: clinic_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: varchar(500)
              - column:
                  name: contact_email
                  type: varchar(255)
              - column:
                  name: contact_phone
                  type: varchar(50)
              - column:
                  name: contact_person
                  type: varchar(255)
              - column:
                  name: operating_status
                  type: varchar(64)

        - createTable:
            tableName: customer
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_customer
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: customer_code
                  type: varchar(64)
              - column:
                  name: date_of_birth
                  type: date
              - column:
                  name: gender
                  type: varchar(32)
              - column:
                  name: address
                  type: varchar(500)
              - column:
                  name: emergency_contact_name
                  type: varchar(255)
              - column:
                  name: emergency_contact_phone
                  type: varchar(50)
              - column:
                  name: status
                  type: varchar(32)
        - addUniqueConstraint:
            tableName: customer
            columnNames: user_id
            constraintName: uq_customer_user_id
        - addForeignKeyConstraint:
            baseTableName: customer
            baseColumnNames: user_id
            constraintName: fk_customer_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

        - createTable:
            tableName: employee
            columns:
