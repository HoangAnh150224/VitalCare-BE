# Audit columns for every business table: who wrote the row, when, and whether
# it is still there.
#
# Written by BaseEntity through Spring Data's AuditingEntityListener, with
# the exception of the deleted pair, which the application sets. See that class
# for why the author columns hold a bare users.id and carry no foreign key.
#
# created_at is NOT NULL and version defaults to 0: these tables were created
# empty by 008, so there is nothing to backfill. Everything else is nullable --
# a row that has never been updated has no updated_at, and a write with no
# signed-in author (a seed, a scheduled job) has no author id.
#
# message.deleted_at is deliberately absent below: 008 already created it as
# the chat's own soft-delete column, and BaseEntity adopts it rather than
# adding a second one.
databaseChangeLog:
  - changeSet:
      id: 009-add-audit-columns
      author: vitalcare
      changes:
        - addColumn:
            tableName: alert
            columns:
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_by_id
                  type: bigint
              - column:
                  name: updated_at
                  type: timestamp with time zone
              - column:
                  name: updated_by_id
                  type: bigint
              - column:
                  name: deleted_at
                  type: timestamp with time zone
              - column:
                  name: deleted_by_id
                  type: bigint
              - column:
                  name: version
                  type: integer
                  defaultValueNumeric: 0
