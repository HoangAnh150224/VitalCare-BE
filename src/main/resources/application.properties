spring.application.name=app-be

# Railway injects PORT at runtime; keep 8080 as the local default.
server.port=${PORT:8080}

# --- Datasource -------------------------------------------------------------
# Local PostgreSQL. Override any of these with the matching SPRING_DATASOURCE_*
# environment variable rather than editing this file per machine.
spring.datasource.url=jdbc:postgresql://localhost:5432/vitalcare
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA --------------------------------------------------------------------
# Liquibase owns the schema; Hibernate only validates that the entities and the
# migrated tables still agree, so a drifted mapping fails at startup instead of
# at the first query.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Only safe together with a UTC JVM, which AppBeApplication.main sets: on any
# other default zone, `time` and `date` columns shift on the way through JDBC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Liquibase --------------------------------------------------------------
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# --- JSON -------------------------------------------------------------------
spring.jackson.time-zone=UTC

# --- Security ---------------------------------------------------------------
# HMAC key the access tokens are signed with. HS256 needs at least 32 bytes and
# the application refuses to start with less. The value below is a development
# default and is in version control, which is exactly why every deployment must
# override it with APP_SECURITY_JWT_SECRET: anyone holding this string can
# mint a token for any account.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:dev-only-secret-change-me-in-every-real-deployment}
app.security.jwt.issuer=app-be
# Short, because nothing can revoke an access token before it expires: this is
# how long a role change or a disabled account takes to actually bite.
app.security.jwt.access-token-ttl=15m
# How long a session survives without signing in again. Rotated on every use.
app.security.jwt.refresh-token-ttl=7d

# --- Registration -----------------------------------------------------------
# One-time codes that prove a phone number belongs to whoever is registering
# it. Six digits for five minutes; five wrong guesses burn the code, so the
# odds of walking it stay at five in a million per code sent.
app.otp.code-length=6
app.otp.code-ttl=5m
app.otp.max-attempts=5
# A resend is refused for this long after the previous code, and at most this
# many codes go to one number per hour -- a real SMS costs money and annoys
# whoever owns the number.
app.otp.resend-cooldown=60s
app.otp.max-per-hour=5

# --- Clinic -----------------------------------------------------------------
# What "today" means for an appointment. A check-in is allowed on the day of
# the appointment as the clinic counts days, not as UTC does -- which would
# move the date boundary to 07:00 in Vietnam.
app.clinic.time-zone=Asia/Ho_Chi_Minh
# How far ahead a slot may be booked. Opening hours change; a booking months
# out is one the clinic can no longer promise to honour.
app.clinic.booking-window-days=30

# --- CORS -------------------------------------------------------------------
# The frontend dev server (code-fe pins port 5176 in vite.config.ts to avoid a
# silent fallback port). Add origins as a comma-separated list; override per
# environment.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5176

# --- Actuator ---------------------------------------------------------------
# Health only, and details only for a caller that authenticated. The row-level
# indicator turns the check DOWN while any policy is quarantined -- a policy
# that is not applying is a security control that is not applying, and the
# whole point of quarantining rather than refusing to start is that it must
# not then be invisible.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# --- uploads, service results ---------------------------------------------------
# A result's file is at most 10 MB (ServiceOrders.MAX_FILE_BYTES); the request a little more.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Where uploaded files are written. A container's disk does not survive a redeploy: mount a volume here.
app.storage.dir=${APP_STORAGE_DIR:./data/uploads}

# --- VNPay (sandbox by default) ------------------------------------------------
# The terminal code and hash secret come from the environment only; empty, online payment is off.
app.vnpay.tmn-code=${APP_VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${APP_VNPAY_HASH_SECRET:}
app.vnpay.pay-url=${APP_VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
# Where VNPay sends the customer back: this API's /payments/vnpay/return, as the browser reaches it.
app.vnpay.return-url=${APP_VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
# Where that return then sends them: the web app.
app.vnpay.fe-base-url=${APP_FE_BASE_URL:http://localhost:5173}

# --- Mail (password-recovery codes) --------------------------------------------
# A Gmail account with 2-step verification and an App Password, from the
# environment only. Empty username: codes go to the log (outside prod); under
# prod no sender means no start-up.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Never fall back to plain text: the App Password would cross the wire in clear.
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:VitalCare <${MAIL_USERNAME:no-reply@vitalcare.local}>}
